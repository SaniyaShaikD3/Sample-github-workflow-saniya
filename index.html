
<!DOCTYPE html>
<html>
<head>
<title>Barbie Shop</title>

<style>
body {
    font-family: Arial;
    background: pink;
    text-align: center;
    margin: 0;
}

header {
    background: deeppink;
    color: white;
    padding: 20px;
}

.products {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
    padding: 30px;
}

.card {
    background: white;
    padding: 20px;
    width: 180px;
    border-radius: 15px;
    box-shadow: 0 4px 10px #888;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.08);
}

.card img {
    width: 100%;
    height: 120px;
    object-fit: contain;
}

button {
    background: deeppink;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 20px;
    cursor: pointer;
}

button:hover {
    background: purple;
}

footer {
    background: deeppink;
    color: white;
    padding: 15px;
}
</style>
</head>

<body>

<header>
    <h1>🎀 Barbie Shop 🎀</h1>
    <p>Welcome to Barbie World!</p>
</header>

<h2>Our Products 💗</h2>

<div class="products">

    <div class="card">
        <img src="https://placehold.co/150x120/ffc0cb/ffffff?text=Barbie+Doll">
        <h3>Barbie Doll</h3>
        <p>Price: ₹500</p>
        <button onclick="buy('Barbie Doll')">Buy Now</button>
    </div>

    <div class="card">
        <img src="https://placehold.co/150x120/f9a8d4/ffffff?text=Pink+Dress">
        <h3>Pink Dress</h3>
        <p>Price: ₹300</p>
        <button onclick="buy('Pink Dress')">Buy Now</button>
    </div>

    <div class="card">
        <img src="https://placehold.co/150x120/e9b8ff/ffffff?text=Shoes">
        <h3>Barbie Shoes</h3>
        <p>Price: ₹200</p>
        <button onclick="buy('Barbie Shoes')">Buy Now</button>
    </div>

</div>

<h2>🛒 Cart: <span id="count">0</span></h2>

<footer>
    <p>© 2026 Barbie Shop</p>
</footer>

<script>
let count = 0;

function buy(product) {
    count++;
    document.getElementById("count").innerText = count;
    alert(product + " added to cart! 💗");
}
</script>

</body>
</html>
